<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <rect width="680" height="320" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- Grid -->
  <g stroke="#f0f0f0" stroke-width="1">
    <line x1="80" y1="40" x2="640" y2="40"/>
    <line x1="80" y1="100" x2="640" y2="100"/>
    <line x1="80" y1="160" x2="640" y2="160"/>
    <line x1="80" y1="220" x2="640" y2="220"/>
    <line x1="80" y1="280" x2="640" y2="280"/>
    <line x1="220" y1="30" x2="220" y2="290"/>
    <line x1="360" y1="30" x2="360" y2="290"/>
    <line x1="500" y1="30" x2="500" y2="290"/>
    <line x1="640" y1="30" x2="640" y2="290"/>
  </g>
  <!-- Trục tọa độ -->
  <line x1="60" y1="160" x2="660" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="300" x2="80" y2="20" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="190" font-family="sans-serif" font-size="14" font-weight="600" fill="#333333">t (s)</text>
  <text x="50" y="25" font-family="sans-serif" font-size="14" font-weight="600" fill="#333333">x (cm)</text>
  <text x="65" y="180" font-family="sans-serif" font-size="14" fill="#666666">0</text>
  <!-- Nhãn trục x -->
  <line x1="75" y1="40" x2="85" y2="40" stroke="#333333" stroke-width="2"/>
  <text x="50" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a73e8">+A</text>
  <line x1="75" y1="280" x2="85" y2="280" stroke="#333333" stroke-width="2"/>
  <text x="45" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ea4335">-A</text>
  <!-- Đường sin x = A cos(wt) -->
  <path d="M 80 40 C 150 40, 150 280, 220 280 C 290 280, 290 40, 360 40 C 430 40, 430 280, 500 280 C 570 280, 570 40, 640 40" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <!-- Điểm mốc chu kì -->
  <line x1="220" y1="155" x2="220" y2="165" stroke="#333333" stroke-width="2"/>
  <text x="210" y="185" font-family="sans-serif" font-size="13" fill="#333333">T/2</text>
  <line x1="360" y1="155" x2="360" y2="165" stroke="#333333" stroke-width="2"/>
  <text x="355" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e8e3e">T</text>
  <!-- Mũi tên chỉ chu kì T -->
  <line x1="80" y1="25" x2="360" y2="25" stroke="#1e8e3e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="195" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e8e3e">Chu kì dao động (T)</text>
</svg>
