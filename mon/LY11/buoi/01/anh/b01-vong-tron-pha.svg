<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <rect width="680" height="320" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- Vòng tròn lượng giác -->
  <circle cx="240" cy="160" r="100" fill="#f8f9fa" stroke="#1a73e8" stroke-width="2.5"/>
  <!-- Trục tọa độ -->
  <line x1="100" y1="160" x2="380" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="240" y1="290" x2="240" y2="30" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="385" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">x</text>
  <text x="245" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">y</text>
  <text x="345" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a73e8">+A</text>
  <text x="125" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea4335">-A</text>
  <text x="225" y="180" font-family="sans-serif" font-size="13" fill="#666666">O</text>
  <!-- Bán kính quay M -->
  <line x1="240" y1="160" x2="310" y2="89" stroke="#d93025" stroke-width="2.5" marker-end="url(#arr2)"/>
  <circle cx="310" cy="89" r="4" fill="#d93025"/>
  <text x="320" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d93025">M(t)</text>
  <!-- Hình chiếu P -->
  <line x1="310" y1="89" x2="310" y2="160" stroke="#666666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="310" cy="160" r="4" fill="#1a73e8"/>
  <text x="305" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a73e8">P (li độ x)</text>
  <!-- Góc pha phi -->
  <path d="M 270 160 A 30 30 0 0 0 261 138" fill="none" stroke="#d93025" stroke-width="1.5"/>
  <text x="275" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d93025">φ</text>
  <!-- Khung giải thích bên phải -->
  <g transform="translate(430, 70)">
    <rect width="220" height="180" fill="#f1f3f4" rx="6"/>
    <text x="15" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#202124">Mối liên hệ:</text>
    <text x="15" y="60" font-family="sans-serif" font-size="13" fill="#333333">• M chuyển động tròn đều</text>
    <text x="15" y="85" font-family="sans-serif" font-size="13" fill="#333333">• P là hình chiếu của M</text>
    <text x="15" y="110" font-family="sans-serif" font-size="13" fill="#333333">• P dao động điều hòa</text>
    <text x="15" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a73e8">x = A·cos(ωt + φ)</text>
  </g>
</svg>
